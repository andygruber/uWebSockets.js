name: Build
on:
  push:
    branches: [ dockerbuild_ubuntu20 ]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest",
            os: windows-latest
          }
        - {
            name: "macOS 15",
            os: macos-15
          }
        - {
            name: "Ubuntu 20.04 x64",
            os: ubuntu-latest,
            container_image: "ubuntu:20.04"
          }
        - {
            name: "Ubuntu 20.04 ARM64",
            os: ubuntu-24.04-arm,
            container_image: "ubuntu:20.04"
          }

    runs-on: ${{ matrix.config.os }}
    container:
      image: ${{ matrix.config.container_image }}

    steps:
      - name: Setup Windows
        if: matrix.config.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup NASM for Windows
        if: matrix.config.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.2.1
      - name: Setup build tools for containers
        if: matrix.config.container_image != null
        env:
          # Prevent tzdata (pulled in by cmake/build-essential) from launching an
          # interactive timezone prompt that hangs the build with no TTY attached.
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          apt-get update
          apt-get install -y build-essential git libssl-dev zlib1g-dev file zip curl jq wget gnupg ca-certificates
          . /etc/os-release
          # clang-16 is not in Ubuntu 20.04 (focal), whose newest is clang-12.
          # Add the official LLVM apt repo to install it.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-16 main" > /etc/apt/sources.list.d/llvm.list
          # Ubuntu 20.04's cmake is 3.16, but the build needs >= 3.22.
          # Add Kitware's official apt repo for an up-to-date cmake.
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ $VERSION_CODENAME main" > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y clang-16 cmake
          # Ubuntu 20.04's bare "clang" is clang-10, which lacks __builtin_source_location
          # and cannot compile Node 26's V8 headers (std::source_location). Force clang-16.
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-16 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-16 100
          echo "::group::Environment info"
          echo "--- distro ---"
          cat /etc/os-release
          echo "--- architecture ---"
          uname -a
          dpkg --print-architecture
          echo "--- glibc ---"
          # ldd --version prints the glibc version on the first line; getconf gives it raw.
          ldd --version | head -n 1
          getconf GNU_LIBC_VERSION
          echo "--- compiler ---"
          clang --version
          clang++ --version
          echo "--- cmake ---"
          cmake --version
          echo "::endgroup::"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Update binaries
        run: |
          git clone --recursive https://github.com/andygruber/uWebSockets.js.git -b dockerbuild_ubuntu20
          cd uWebSockets.js
          ${{ matrix.config.os == 'windows-latest' && 'nmake' || 'make' }}
          ls dist
          cd tests && npm install ws && node smoke.js && cd ..
          ls dist
          git fetch origin binaries:binaries
          git checkout binaries
          cp dist/*.node .
          cp dist/*.js .
          git rev-parse origin/dockerbuild_ubuntu20 > source_commit
          ls
          ${{ matrix.config.os != 'windows-latest' && 'git checkout dockerbuild_ubuntu20 docs/index.d.ts && mv docs/index.d.ts .' || '' }}
          git status
          git config --global user.email "alexhultman@gmail.com"
          git config --global user.name "Alex Hultman"
          git commit -a -m "[GitHub Actions] Updated ${{ matrix.config.name }} binaries" || true
          git push "https://andygruber:${{ secrets.SECRET }}@github.com/andygruber/uWebSockets.js" binaries
